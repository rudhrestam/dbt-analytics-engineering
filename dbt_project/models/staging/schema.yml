version: 2

models:
  - name: stg_customers
    description: "Cleaned customers, one row per customer"
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: email
        tests: [not_null]
      - name: home_store
        tests:
          - accepted_values:
              arguments:
                values: ['Downtown', 'Airport', 'Suburb North', 'Suburb South', 'Campus']

  - name: stg_products
    description: "Cleaned product catalogue"
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: category
        tests:
          - accepted_values:
              arguments:
                values: ['burgers', 'chicken', 'sides', 'drinks', 'desserts', 'salads']
      - name: unit_price
        tests: [not_null]

  - name: stg_orders
    description: "Cleaned orders, one row per order"
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: channel
        tests:
          - accepted_values:
              arguments:
                values: ['dine_in', 'takeaway', 'delivery_app', 'drive_thru']
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['completed', 'refunded', 'cancelled']

  - name: stg_order_items
    description: "Cleaned order line items"
    columns:
      - name: item_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        tests: [not_null]
